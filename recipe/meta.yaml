{% set name = "azure-mgmt-eventgrid" %}
{% set version = "10.2.0b2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.zip
  sha256: 41c1d8d700b043254e11d522d3aff011ae1da891f909c777de02754a3bb4a990

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - setuptools
    - wheel
    - python
    - pip
  run:
    - python
    - msrest >=0.6.21
    - azure-common >=1.1,<2
    - azure-mgmt-core>=1.3.0,<2.0.0
    # _event_grid_management_client_enums.py - line 10
    # from six import with_metaclass
    - six

test:
  imports:
    - azure.mgmt.eventgrid
    - azure.mgmt.eventgrid.aio
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Event Grid Management Client Library for Python
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: |
    This is the Microsoft Azure Event Grid Management Client Library.
  doc_url: https://github.com/Azure/azure-sdk-for-python
  dev_url: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - janjagusch
